site_name: ADVT Documentation
site_description: Documentation for Autonomous Drone at Virginia Tech.
site_url: https://advt-vt.github.io/
repo_name: advt-vt/advt
repo_url: https://github.com/advt-vt/advt

theme:
    name: material
    logo: assets/logo.png
    favicon: assets/logo.png
    icon:
        repo: fontawesome/brands/git-alt
    palette:
        - scheme: slate
          toggle:
            icon: material/brightness-4
            name: Switch to light mode

        - scheme: default
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode
    features:
        - content.code.copy
        - content.code.select
        - navigation.instant
        - navigation.instant.progress
        - navigation.instant.preview
        - search.suggest
        - search.share

plugins:
    - search

markdown_extensions:
    - pymdownx.betterem
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.tilde
    - admonition

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/advt-vt
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/advtowner
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/official_advt/

nav:
    - Home: index.md

    - Getting Started:
        - Installing Software: getting_started/installing_software.md
        - Setting Up the Development Container: getting_started/setting_up_dev_container.md
        - Writing Documentation (OPTIONAL): getting_started/writing_documentation.md
        - Installing PX4 (OPTIONAL): getting_started/installing_px4.md

    - Workflow: workflow.md